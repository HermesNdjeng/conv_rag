[tool.poetry]
name = "conv-rag"
version = "0.1.0"
description = "Conversational agent with a retrieval augmented generation architecture"
authors = ["HermesNdjeng <yanndjeng@yahoo.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<=3.12"
minio = "^7.2"
langchain = "^0.3.25"
langchain-community = "^0.3.24"
langchain-openai = "^0.3.16"
faiss-cpu = "^1.11.0"
sentence-transformers = "^4.1.0"
pypdf = "^5.5.0"
chromadb = "^1.0.9"
tiktoken = "^0.9.0"
pydantic = "^2.11.4"
colorlog = "^6.9.0"
streamlit = "^1.45.1"
pdf2image = "^1.17.0"
pillow = "^11.2.1"
pypdf2 = "^3.0.1"
pymupdf = "^1.25.5"
matplotlib = "^3.10.3"
pytest = "^9.1.0"
redis = "^8.0.0"



[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.3.0"
ruff = "^0.1.9"
pyright = "^1.1.338"

# Ruff configuration
[tool.ruff]
line-length = 100
target-version = "py311"

# Enable rule sets including import sorting
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # flake8-bandit (security)
]

ignore = [
    "E203",  # whitespace before ':'
    "S101",  # use of assert (common in tests)
]

exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".eggs",
    "*.egg",
    ".venv",
    ".env",
    "data",
    ".ipynb_checkpoints",
]

# Add this to enable auto-fixing
fix = true
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# Configure import sorting (replaces isort configuration)
[tool.ruff.isort]
force-single-line = false
force-sort-within-sections = false
lines-after-imports = 2
known-first-party = ["conv_rag"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

# Pyright configuration
[tool.pyright]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
exclude = [
    "**/__pycache__",
    "build",
    "dist",
    ".venv",
    "data",
    "tests",
    "notebooks",
    ".ipynb_checkpoints"
]

# Type checking strictness
typeCheckingMode = "strict"
reportUnknownVariableType = "none"
reportUnknownParameterType = "none"
reportUnknownArgumentType = "none"
reportUnknownMemberType = "none"
reportMissingTypeStubs = "none"
